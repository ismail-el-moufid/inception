# Set the user and group that the worker processes will run as (security best practice)
user nginx;

# Automatically adjust the number of worker processes based on available CPU cores
worker_processes auto;

# Redirect error logs to the standard error output of the container process
error_log /proc/self/fd/2 info;

# Store the Process ID of the main Nginx process to allow signal handling
pid /var/run/nginx.pid;

# Keep the Nginx process running in the foreground so the container doesn't exit immediately
daemon off;

# Configuration block for connection handling
events
{
	# Allow each worker process to handle up to 1024 simultaneous connections
	worker_connections 1024;
}

# Configuration block for HTTP server settings
http
{
	# Load the mapping of file extensions to MIME types
	include /etc/nginx/mime.types;

	# Set the default MIME type for files with unknown extensions to binary stream
	default_type application/octet-stream;
	
	# Redirect access logs to the standard output of the container process
	access_log /proc/self/fd/1;

	# Configuration block for a specific virtual server
	server
	{
		# Accept HTTPS connections on port 443
		listen 443 ssl;

		# Match requests with this domain name or simply localhost
		server_name DOMAIN_NAME_PLACEHOLDER localhost;

		# Path to the public certificate file for SSL encrpytion
		ssl_certificate /etc/nginx/ssl/server.crt;

		# Path to the private key file for SSL decryption
		ssl_certificate_key /etc/nginx/ssl/server.key;

		# Only allow secure TLS versions (blocking old SSLv3 and TLSv1.0/1.1)
		ssl_protocols TLSv1.2 TLSv1.3;

		# Set the base directory for serving static files
		root /var/www/html;

		# Specify the priority order of files to look for when a directory is requested
		index index.php index.html index.htm;

		# Default handling for the root URL path
		location /
		{
			# Check existence of file ($uri), then folder ($uri/), else route to index.php
			try_files $uri $uri/ /index.php?$args;
		}

		# Handle requests for PHP files
		location ~ \.php$
		{
			# Return a 404 error if the requested PHP file does not actually exist
			try_files $uri =404;

			# Split the URL into the script name (.php) and path info (extra path segments)
			fastcgi_split_path_info ^(.+\.php)(/.+)$;

			# Forward the PHP processing to the wordpress container on port 9000
			fastcgi_pass wordpress:9000;

			# Load standard FastCGI configuration parameters
			include fastcgi_params;

			# Tell PHP which file on disk it should execute
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

			# Pass extra path information to the PHP script
			fastcgi_param PATH_INFO $fastcgi_path_info;
		}

		# Specific rule for handling the Adminer database management tool
		location = /adminer.php
		{
			# Forward the request to the adminer container service
			proxy_pass http://adminer:8080;

			# Use HTTP/1.1 for the proxy connection (better performance/keepalive)
			proxy_http_version 1.1;

			# Pass the original Host header to the upstream server
			proxy_set_header Host $host;

			# Pass the client's real IP address to the upstream server
			proxy_set_header X-Real-IP $remote_addr;

			# Append the client's IP to the list of forwarded for addresses
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

			# Inform the upstream server if the original request was http or https
			proxy_set_header X-Forwarded-Proto $scheme;

			# Clear the Connection header to support keep-alive properly
			proxy_set_header Connection "";
		}

		# Handle requests starting with /Docs (static site generation documentation)
		location = /Docs
		{
			# Forward requests to the docs service/container
			proxy_pass http://docs/;

			# Use HTTP/1.1 for the proxy connection
			proxy_http_version 1.1;

			# Pass the original Host header to the docs server
			proxy_set_header Host $host;

			# Pass the client's real IP address
			proxy_set_header X-Real-IP $remote_addr;

			# Append client's IP to forwarded list
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

			# Pass the original protocol (http/https)
			proxy_set_header X-Forwarded-Proto $scheme;

			# Clear the Connection header
			proxy_set_header Connection "";
		}
	}
}