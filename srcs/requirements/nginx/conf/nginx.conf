user nginx;
worker_processes auto;
error_log /proc/self/fd/2 info;
pid /var/run/nginx.pid;
daemon off;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	# Optimize access logs
	log_format main '$remote_addr - $remote_user [$time_local] "$request" '
					'$status $body_bytes_sent "$http_referer" '
					'"$http_user_agent" "$http_x_forwarded_for"';
	access_log /proc/self/fd/1 main;

	# Basic optimizations
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;
	
	# Gzip compression
	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

	# FastCGI cache for WordPress
	fastcgi_cache_path /var/cache/nginx/fastcgi_temp levels=1:2 keys_zone=WORDPRESS:100m inactive=60m;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";
    fastcgi_cache_use_stale error timeout invalid_header http_500;
    fastcgi_ignore_headers Cache-Control Expires Set-Cookie;

	server {
		listen 443 ssl;
		http2 on;
		# This placeholder gets replaced by init script
		server_name DOMAIN_NAME_PLACEHOLDER localhost;

		ssl_certificate /etc/nginx/ssl/server.crt;
		ssl_certificate_key /etc/nginx/ssl/server.key;
		
		# Modern SSL configuration
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_ciphers HIGH:!aNULL:!MD5;
		ssl_prefer_server_ciphers on;

		root /var/www/html;
		index index.php index.html index.htm;

		location / {
			try_files $uri $uri/ /index.php?$args;
		}

		location ~ \.php$ {
			try_files $uri =404;
			fastcgi_split_path_info ^(.+\.php)(/.+)$;
			fastcgi_pass wordpress:9000;
			fastcgi_index index.php;
			
			include fastcgi_params;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_param PATH_INFO $fastcgi_path_info;
			
			# CRITICAL: Tell PHP-FPM we are behind HTTPS so WordPress doesn't loop
			fastcgi_param HTTPS on;
			fastcgi_param HTTP_SCHEME https;

			# Added: ensure PHP gets correct host/scheme/port and client IP info
			fastcgi_param HTTP_HOST $host;
			fastcgi_param SERVER_NAME $host;
			fastcgi_param SERVER_PORT 443;
			fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
			fastcgi_param X-Forwarded-For $proxy_add_x_forwarded_for;

			# Use fastcgi.conf semantics and ensure cookies/host/port are passed
			fastcgi_param HTTP_COOKIE $http_cookie;
			fastcgi_param HTTP_HOST $http_host;
			fastcgi_param SERVER_NAME $server_name;
			fastcgi_param SERVER_PORT $server_port;
			fastcgi_param REMOTE_ADDR $remote_addr;
		}

		location = /adminer.php {
			proxy_pass http://adminer:8080;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Connection "";
		}

		location ^~ /Docs {
			proxy_pass http://docs/;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Connection "";
		}

		location ~ /\.ht {
			deny all;
		}
	}
}