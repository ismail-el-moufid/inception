# Allow connections from other containers
bind 0.0.0.0

# Standard port
port 6379

# Disable protected mode to allow Docker network connections
protected-mode no

# Docker containers must run in the foreground
daemonize no

# Memory limit (VM has limited RAM, 20-128mb is enough for this project)
maxmemory 50mb

# Eviction policy: remove least recently used keys when full
maxmemory-policy allkeys-lru