services:
  mariadb:
    build:
      context: requirements/mariadb
    container_name: mariadb
    environment:
      DB_NAME: wordpress
      DB_USER: wordpress
      DB_PASSWORD: wordpress_password
      DB_CLIENT_HOST: "%"
      ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

  wordpress:
    build:
      context: requirements/wordpress
    container_name: wordpress
    environment:
      DB_NAME: wordpress
      DB_USER: wordpress
      DB_PASSWORD: wordpress_password
      DB_HOST: mariadb
      AUTH_KEY: test_key
      SECURE_AUTH_KEY: test_key
      LOGGED_IN_KEY: test_key
      NONCE_KEY: test_key
      AUTH_SALT: test_salt
      SECURE_AUTH_SALT: test_salt
      LOGGED_IN_SALT: test_salt
      NONCE_SALT: test_salt
    ports:
      - "9000:9000"
    depends_on:
      - mariadb
    networks:
      - inception

volumes:
  mariadb_data:

networks:
  inception: